name: Deploy Tokyo Streets

on:
  workflow_run:
    workflows: ["Game checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tokyonight-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only a successful CI run from a push to our own main branch may deploy.
    # Pull-request runs and forked repositories never receive deploy credentials.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure pinned SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOKYO_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TOKYO_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "::error::Configure TOKYO_DEPLOY_SSH_KEY and TOKYO_DEPLOY_KNOWN_HOSTS first."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Publish verified release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/deploy-vps.sh
